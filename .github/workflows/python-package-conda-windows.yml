name: Python Package using Conda (Windows 11)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Conda Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.10"
        activate-environment: test-environment
        auto-activate-base: false

    - name: Install Dependencies
      run: |
        conda install pytest -y
        if (Test-Path "environment.yml") {
          conda env update --file environment.yml --name test-environment
        }
        if (Test-Path "requirements.txt") {
          pip install -r requirements.txt
        }
        if (Test-Path "inkling-small/requirements.txt") {
          pip install -r inkling-small/requirements.txt
        }

    - name: Run Pytest
      run: |
        if (-not (Test-Path "tests")) {
          New-Item -ItemType Directory -Path "tests" | Out-Null
          Set-Content -Path "tests/test_placeholder.py" -Value "def test_placeholder(): assert True"
        }
        pytest -v
